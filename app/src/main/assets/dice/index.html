<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #dice { position: absolute; inset: 0; }
    canvas { display: block; }
  </style>
</head>
<body>
<div id="dice"></div>
<script src="dice-box-threejs.umd.js"></script>
<script>
  // 3D dice overlay prototype (IRON-12). The host app decides every result and passes it in;
  // this page only animates the dice so they land on those values and reports render metrics.
  (function () {
    const bridge = window.DiceBridge;
    const DiceBox = window["dice-box-threejs"].default || window["dice-box-threejs"];

    const ACTION_SET = { name: "action", foreground: "#f5f1e8", background: "#1c1c1c", outline: "#1c1c1c", texture: "none", material: "plastic" };
    const CHALLENGE_SET = { name: "challenge", foreground: "#1c1c1c", background: "#e9e3d5", outline: "#e9e3d5", texture: "none", material: "plastic" };

    const SLOW_FRAME_MS = 20;
    // Walls sit at this fraction of the visible area (the library uses 0.93), so dice tops seen
    // in perspective do not spill past the screen edge.
    const WALL_FRACTION = 0.88;
    // A throw is redone, before anything is shown, if it needs more physics steps than this
    // (60 per second) to settle: long settles are dice wobbling against each other.
    const MAX_SETTLE_STEPS = 210;
    const MAX_THROW_ATTEMPTS = 8;
    // A die is unreadable if its lowest point is off the table (resting on another die) or its
    // top face is tilted (leaning on another die).
    const MAX_LIFT_FRACTION = 0.2;
    const MAX_TILT_RAD = 0.15;
    // Seconds a die must stay still to count as settled (the library waits 0.9 s, which makes
    // the roll feel long after the dice have visibly stopped).
    const SLEEP_TIME_LIMIT_S = 0.4;

    let box = null;
    let frameTimes = null;
    let pendingNotation = null;
    let throwLog = null;
    let stepLog = null;
    let simulationMs = 0;

    function report(method, payload) {
      if (bridge && bridge[method]) bridge[method](JSON.stringify(payload));
    }

    // Counts frames actually drawn by the library, not display refreshes, so a 120 Hz screen
    // does not inflate the numbers.
    function instrumentRenderer() {
      const renderer = box.renderer;
      const render = renderer.render.bind(renderer);
      renderer.render = function (scene, camera) {
        render(scene, camera);
        if (frameTimes) frameTimes.push(performance.now());
      };
    }

    // The library uses one colour set per box; switch it per die so action and challenge
    // dice look different (RF-DAD-02).
    async function installPerDieColors() {
      const action = await box.DiceColors.makeColorSet(ACTION_SET);
      const challenge = await box.DiceColors.makeColorSet(CHALLENGE_SET);
      const factory = box.DiceFactory;
      const create = factory.create.bind(factory);
      factory.create = function (type) {
        factory.applyColorSet(type === "d6" ? action : challenge);
        return create(type);
      };
    }

    function shortenSettleWait() {
      const spawnDice = box.spawnDice.bind(box);
      box.spawnDice = function (vector, existing) {
        spawnDice(vector, existing);
        const die = existing || box.diceList[box.diceList.length - 1];
        if (die && die.body) die.body.sleepTimeLimit = SLEEP_TIME_LIMIT_S;
      };
    }

    function shrinkWalls() {
      const makeWorldBox = box.makeWorldBox.bind(box);
      box.makeWorldBox = function () {
        makeWorldBox();
        const k = WALL_FRACTION / 0.93;
        const walls = box.box_body;
        walls.topWall.position.y *= k;
        walls.bottomWall.position.y *= k;
        walls.leftWall.position.x *= k;
        walls.rightWall.position.x *= k;
      };
    }

    // Why a settled die cannot be read, or null if it lies flat on the table.
    function unreadableReason(die) {
      die.position.copy(die.body.position);
      die.quaternion.copy(die.body.quaternion);
      die.updateMatrixWorld(true);
      const geometry = die.geometry;
      if (!geometry.boundingSphere) geometry.computeBoundingSphere();
      const radius = geometry.boundingSphere.radius;

      const positions = geometry.getAttribute("position");
      const v = die.position.clone();
      let lowest = Infinity;
      for (let i = 0; i < positions.count; i++) {
        v.fromBufferAttribute(positions, i).applyMatrix4(die.matrixWorld);
        lowest = Math.min(lowest, v.z);
      }
      if (lowest > radius * MAX_LIFT_FRACTION) return "stacked";

      // Same face test the library uses to read the value: the face whose normal points up.
      const normals = geometry.getAttribute("normal").array;
      const up = v.clone().set(0, 0, die.shape === "d4" ? -1 : 1);
      let tilt = Infinity;
      for (let g = 0; g < geometry.groups.length; g++) {
        if (geometry.groups[g].materialIndex === 0) continue;
        const n = v.clone().set(normals[g * 9], normals[g * 9 + 1], normals[g * 9 + 2]);
        tilt = Math.min(tilt, n.applyQuaternion(die.body.quaternion).angleTo(up));
      }
      return tilt > MAX_TILT_RAD ? "tilted" : null;
    }

    // The library simulates the whole throw before animating it. Inspect that hidden result and
    // throw again until every die lands flat, apart and quickly enough.
    function installCleanThrows() {
      const simulate = box.simulateThrow.bind(box);
      box.simulateThrow = function () {
        const startedAt = performance.now();
        for (let attempt = 1; ; attempt++) {
          simulate();
          let reason = box.iteration > MAX_SETTLE_STEPS ? "slow" : null;
          for (const die of box.diceList) reason = reason || unreadableReason(die);
          if (throwLog) throwLog.push(reason || "ok");
          if (stepLog) stepLog.push(box.iteration);
          if (!reason || attempt >= MAX_THROW_ATTEMPTS) break;
          box.notationVectors = box.startClickThrow(pendingNotation);
          for (const vector of box.notationVectors.vectors) box.spawnDice(vector);
        }
        simulationMs = performance.now() - startedAt;
        // Frames drawn while clearing the table are not part of the animation.
        if (frameTimes) frameTimes = [];
      };
    }

    function frameStats(times, startedAt) {
      const gaps = [];
      for (let i = 1; i < times.length; i++) gaps.push(times[i] - times[i - 1]);
      const span = times.length > 1 ? times[times.length - 1] - times[0] : 0;
      return {
        frames: times.length,
        avgFps: span > 0 ? (times.length - 1) * 1000 / span : 0,
        worstFrameMs: gaps.length ? Math.max(...gaps) : 0,
        slowFrames: gaps.filter(g => g > SLOW_FRAME_MS).length,
        firstFrameMs: times.length ? times[0] - startedAt : 0,
      };
    }

    async function roll(action, challenge1, challenge2) {
      if (!box) return;
      const notation = "1d6+2d10@" + [action, challenge1, challenge2].join(",");
      frameTimes = [];
      pendingNotation = notation;
      throwLog = [];
      stepLog = [];
      const startedAt = performance.now();
      try {
        const result = await box.roll(notation);
        const stats = frameStats(frameTimes, startedAt);
        frameTimes = null;
        const shown = result.sets.flatMap(set => set.rolls.map(r => r.value));
        report("onRollComplete", Object.assign({
          notation: notation,
          shown: shown,
          durationMs: performance.now() - startedAt,
          simulationMs: simulationMs,
          throws: throwLog,
          steps: stepLog,
        }, stats));
      } catch (e) {
        frameTimes = null;
        report("onError", { message: String(e) });
      }
    }

    async function init() {
      const startedAt = performance.now();
      try {
        box = new DiceBox("#dice", {
          assetPath: "./",
          sounds: false,
          shadows: true,
          theme_material: "plastic",
          baseScale: 100,
        });
        shrinkWalls();
        await box.initialize();
        await installPerDieColors();
        installCleanThrows();
        shortenSettleWait();
        instrumentRenderer();
        const gl = box.renderer.getContext();
        const info = gl.getExtension("WEBGL_debug_renderer_info");
        report("onReady", {
          initMs: performance.now() - startedAt,
          width: window.innerWidth,
          height: window.innerHeight,
          pixelRatio: window.devicePixelRatio,
          gpu: info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : "unknown",
        });
      } catch (e) {
        report("onError", { message: String(e) });
      }
    }

    // The library renders at 1 CSS pixel per pixel; sharp mode uses the screen's real density
    // to compare quality against frame rate.
    function setSharp(sharp) {
      if (!box) return;
      box.renderer.setPixelRatio(sharp ? window.devicePixelRatio : 1);
      box.renderer.setSize(box.container.clientWidth, box.container.clientHeight);
      box.renderer.render(box.scene, box.camera);
    }

    window.irondroidDice = { roll: roll, setSharp: setSharp, clear: () => box && box.clearDice() };
    init();
  })();
</script>
</body>
</html>
